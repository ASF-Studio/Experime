<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="color-scheme" content="light only"><meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغامرة الراكون</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#ffffff;--line:#cfe2f5;--marg:#f4a6ab;--ink:#3b3350;--chip:#fffbe8;--wall:#f6e7c8;--c1:#ff8a5c;--c2:#ffd35c;--c3:#86d9ae;--c4:#98bfff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;touch-action:manipulation;-webkit-touch-callout:none;overscroll-behavior:none}
@media (max-width:700px){h1{margin-bottom:10px}.cards{gap:3vw}.card{width:40vw}.btn{min-width:200px}}
body{background:#fff;color-scheme:light;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:var(--ink);user-select:none}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(270deg,transparent 0 64px,var(--marg) 64px 66px,transparent 66px),repeating-linear-gradient(0deg,transparent 0 31px,var(--line) 31px 32px),var(--paper)}
.bind{position:fixed;top:0;bottom:0;right:12px;width:26px;pointer-events:none;opacity:.45;background:radial-gradient(circle,#0000 0 6px,var(--ink) 6px 8px,#0000 8px) 0 0/26px 76px repeat-y}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:10px 84px 10px 18px;animation:fade .4s}
.screen.on{display:flex}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
h1{font-size:clamp(40px,min(12vw,22vh),120px);white-space:nowrap;text-align:center;font-weight:900;margin:0 0 18px;line-height:1.1;filter:url(#cr);color:var(--c1);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill}
h2{font-size:clamp(22px,4vw,34px);margin:0 0 6px;filter:url(#cr2)}
.ico{filter:url(#cr2);overflow:visible}
.sk{position:relative;isolation:isolate}
.bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible;filter:url(#cr)}
.bg path{vector-effect:non-scaling-stroke}.bg .sh{fill:var(--ink);opacity:.85}.bg .mn{fill:var(--bc,var(--chip));stroke:var(--ink);stroke-width:3.5}
.btn{position:relative;isolation:isolate;font:inherit;font-weight:900;font-size:clamp(18px,3vw,25px);color:var(--ink);background:none;border:0;min-width:240px;height:62px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 26px;transition:transform .12s}
.btn:hover{transform:translate(-1px,-2px) rotate(-1.2deg)}.btn:active{transform:translate(3px,4px)}.btn .ico{width:28px;height:28px}
.stack{display:flex;flex-direction:column;gap:16px;align-items:center}
.mrow{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:8px}
.mbtns{display:flex;flex-direction:column;align-items:center}
.mart{display:flex;width:min(44vw,calc(100dvh - 60px),420px)}
.mart svg{width:56%;margin-inline:-6%}.mart svg:last-child{transform:translateY(6%)}
.chip{padding:2px 22px;font-weight:900;font-size:clamp(15px,2.6vw,22px)}
.cards{display:flex;gap:4vw;justify-content:center}
.card{font:inherit;color:inherit;background:none;border:0;padding:12px 22px;cursor:pointer;transition:transform .2s;text-align:center;width:min(36vw,230px)}
.card:hover{transform:translateY(-6px) rotate(-1.5deg)}.card .rc{width:min(24vh,150px)}.card b{display:block;font-size:clamp(20px,3.4vw,30px)}
.modal{padding:22px 34px;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:100%}
.modal .bg .mn{fill:var(--chip)}.modal .sub{margin:0;font-size:clamp(14px,2.4vw,19px);opacity:.85}
.row{display:flex;align-items:center;justify-content:space-between;gap:24px;width:260px;font-weight:700;font-size:20px;cursor:pointer}
.cbx{width:38px;height:38px}.cbx .bx{fill:var(--paper);stroke:var(--ink);stroke-width:4}.cbx .ck{fill:none;stroke:var(--c1);stroke-width:8;stroke-linecap:round;stroke-dasharray:90;stroke-dashoffset:90;transition:stroke-dashoffset .25s}
.row.on .ck{stroke-dashoffset:0}
.bars{display:flex;gap:4px;align-items:flex-end;direction:ltr}.bars button{background:none;border:0;padding:0;cursor:pointer}.bars svg{width:16px;overflow:visible;filter:url(#cr2)}.bars path{stroke:var(--ink);stroke-width:7;stroke-linecap:round;opacity:.35}.bars .on path{stroke:var(--c1);opacity:1}
.top{min-height:44px;display:flex;align-items:center;justify-content:center}
.gs{justify-content:flex-start;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.stagew{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
.stage{position:relative;direction:ltr;width:min(100%,calc((100dvh - 190px)*2),760px);aspect-ratio:2/1;transform-origin:70% 70%;transition:transform 1s ease,opacity 1s ease}
.hud{height:88px;display:flex;align-items:center;justify-content:center;width:100%}
.msg{font-weight:900;font-size:clamp(16px,3vw,25px);text-align:center}
@keyframes rdyPop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}
.rcw{position:absolute;bottom:0;left:6%;width:22%;z-index:5;transform-origin:50% 100%;transition:left var(--dur,.8s) ease-in-out}
.rc{width:100%;overflow:visible;filter:url(#cr) drop-shadow(1.6px 1.2px 0 rgba(42,40,50,.32))}.clean .rc{filter:url(#cr2) drop-shadow(1.6px 1.2px 0 rgba(42,40,50,.32))}
.rc g{transform-box:fill-box}
.legL,.legR,.armL,.armR{transform-origin:50% 6%}.head{transform-origin:50% 92%}.tail{transform-origin:8% 80%}.bod,.all{transform-origin:50% 100%}
.tail{animation:tw 1.8s ease-in-out infinite alternate}.bod{animation:br 2.6s ease-in-out infinite}
@keyframes tw{from{transform:rotate(-6deg)}to{transform:rotate(9deg)}}@keyframes br{50%{transform:scale(1.02,1.03)}}
.rc .e-h,.rc .m-h,.rc .e-s,.rc .m-s,.rc .tear{display:none}
.e-n{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.5s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes lg{from{transform:rotate(calc(var(--sw,26deg)*-1))}to{transform:rotate(var(--sw,26deg))}}
@keyframes wb{0%,100%{transform:translateY(0) scale(1.02,.98)}50%{transform:translateY(-7px) scale(.98,1.02)}}
@keyframes hb{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(4deg) translateY(-2px)}}
@keyframes tws{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.walk .legL,.walk .legR,.walk .armL,.walk .armR{animation:lg var(--wd,.38s) ease-in-out infinite alternate}
.walk .legR,.walk .armL{animation-direction:alternate-reverse}.walk .armL,.walk .armR{--sw:20deg}
.walk .all{animation:wb var(--wd,.38s) ease-in-out infinite}.walk .head{animation:hb var(--wd,.38s) ease-in-out infinite alternate}.walk .tail{animation:tws calc(var(--wd,.38s)*1.5) ease-in-out infinite alternate}
.sneak{--sw:15deg}.sneak .all{animation-name:wb}.sneak .bod{transform:rotate(6deg)}
@keyframes hj{0%,100%{transform:translateY(0) scale(1.08,.9)}50%{transform:translateY(-26px) scale(.92,1.1)}}
@keyframes wvL{from{transform:rotate(135deg)}to{transform:rotate(165deg)}}@keyframes wvR{from{transform:rotate(-135deg)}to{transform:rotate(-165deg)}}
.happy .all{animation:hj .55s ease-in-out infinite}.happy .armL{animation:wvL .27s ease-in-out infinite alternate}.happy .armR{animation:wvR .27s ease-in-out infinite alternate}
.happy .e-n,.happy .m-n{display:none}.happy .e-h,.happy .m-h{display:inline}.happy .tail{animation:tws .2s ease-in-out infinite alternate}
@keyframes sd{0%,100%{transform:scale(1.04,.92)}50%{transform:scale(1.02,.89) translateY(3px)}}
.sad .all{animation:sd 2.2s ease-in-out infinite}.sad .head{transform:rotate(-12deg) translateY(8px)}.sad .armL{transform:rotate(14deg)}.sad .armR{transform:rotate(-14deg)}.sad .tail{animation:none;transform:rotate(-28deg)}
.sad .m-n,.sad .e-n{display:none}.sad .m-s,.sad .e-s,.sad .tear{display:inline}.sad .e-sad{display:inline}
.held{position:absolute;left:12%;right:12%;top:-24%;display:none}.held.on{display:block;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}.held .ico{width:100%;display:block}
@keyframes pop{from{transform:scale(.2)}}
.can{position:absolute;left:18%;bottom:4%;width:20%;aspect-ratio:100/130;z-index:1;transform:translate(calc(var(--s)*110%),var(--y,0px)) rotate(var(--r,0deg));transition:transform var(--d,.5s) cubic-bezier(.45,0,.25,1)}
.can svg.cb,.can svg.lid{position:absolute;overflow:visible;filter:url(#cr2)}.can .cb{inset:0;width:100%;height:100%}
.can .lid{left:-2%;width:104%;top:-4%;height:20%;transform-origin:0 100%;transition:transform .45s cubic-bezier(.3,1.4,.5,1);z-index:3}
.can.mv{transition:none}#r1{display:none}.can.open .lid{transform:rotate(-78deg) translate(-4%,-8%)}.can.ready{cursor:pointer}.can.ready:hover{--y:-8px;--r:-2deg}
.can.shake{animation:shake .15s infinite}@keyframes shake{25%{rotate:-3deg}75%{rotate:3deg}}
.item{position:absolute;left:16%;right:16%;top:-12%;opacity:0;z-index:2;pointer-events:none}.item .ico{width:100%;display:block}
.item.drop{animation:drop .9s ease-in forwards}@keyframes drop{from{transform:translateY(-110%) rotate(-20deg);opacity:1}70%{opacity:1}to{transform:translateY(160%) rotate(20deg);opacity:0}}
.item.show{opacity:1;animation:pop2 .5s cubic-bezier(.3,1.6,.5,1) forwards}@keyframes pop2{from{transform:translateY(60%) scale(.3)}to{transform:translateY(-35%) scale(1)}}
.tr{position:absolute;width:clamp(24px,5.4vw,46px)}.tr .ico{width:100%;display:block}
.puff{position:absolute;z-index:4;width:clamp(22px,4vw,36px);animation:puff .9s ease-out forwards}.puff .ico{width:100%}
@keyframes puff{to{transform:translate(var(--dx),var(--dy,-90px)) rotate(200deg) scale(.5);opacity:0}}
.ov{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.wall{fill:var(--wall);stroke:var(--ink);stroke-width:3;vector-effect:non-scaling-stroke}.ht{fill:none;stroke:var(--ink);opacity:.18;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linecap:round}
.pl,.br{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;vector-effect:non-scaling-stroke}.br{stroke-width:3}
.gi use{filter:url(#cr2)}#tgt{animation:glow 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes glow{to{transform:scale(1.1) rotate(-3deg);filter:drop-shadow(0 0 3px gold)}}
.smash{position:fixed;inset:0;z-index:999;pointer-events:none;overflow:hidden}
.smash .fly{position:absolute;left:50%;top:50%;width:min(70vw,70vh);transform:translate(-50%,-50%) scale(.08) rotate(0);animation:flyin .55s cubic-bezier(.5,0,.9,.4) forwards}
.smash .fly svg{width:100%;display:block}
@keyframes flyin{to{transform:translate(-50%,-48%) scale(1) rotate(-14deg)}}
.smash .fly.hit{animation:flat 1.6s ease-in forwards}
@keyframes flat{0%{transform:translate(-50%,-48%) scale(1.05,.95) rotate(-14deg)}40%{transform:translate(-50%,-48%) scale(1,1) rotate(-14deg)}100%{transform:translate(-50%,40%) scale(1) rotate(-30deg);opacity:.9}}
.smash .crk{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.smash .crk.on{opacity:1;animation:crk .12s steps(1)}
.smash .crk path{fill:none;stroke:rgba(255,255,255,.95);stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.8))}
.smash .glass{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.35),rgba(200,220,255,.08) 40%,transparent 70%);opacity:0}
.smash .glass.on{opacity:1;transition:opacity .1s}
@keyframes crk{0%{opacity:0}}
body.quake{animation:quake .45s linear}
@keyframes quake{10%{transform:translate(-14px,8px) rotate(-1deg)}25%{transform:translate(12px,-10px) rotate(1deg)}40%{transform:translate(-10px,-6px)}55%{transform:translate(8px,8px)}70%{transform:translate(-5px,3px)}85%{transform:translate(3px,-2px)}}
.cone{fill:rgba(255,222,70,.4);stroke:var(--ink);stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}.cone.bad{fill:rgba(255,60,60,.5)}
.wall2{fill:url(#bk);stroke:none}.plk rect{fill:#e0ad72;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}.tag{fill:#fff7c9;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}.ht2{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.6;vector-effect:non-scaling-stroke;stroke-linecap:round}.pos{fill:#fff;stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke}
.cam{fill:#d9d3f0;stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke}.bolt{fill:var(--ink)}.lens{fill:#e2574c;animation:lb 1s steps(2) infinite}@keyframes lb{50%{opacity:.25}}
.sign{position:absolute;left:3%;top:3%;z-index:2;padding:0 14px;font-weight:900;font-size:clamp(14px,2.8vw,22px)}.sign .mn{fill:var(--c2)}
#gs .rcw{width:20%;bottom:2%;left:4%;transition:none;z-index:3}
.box{display:none;position:absolute;left:0;right:0;bottom:0}.box .ico{width:100%;display:block}
.duck svg.rc{visibility:hidden}.duck .box{display:block;animation:bx .2s ease-out}@keyframes bx{from{transform:translateY(-45%) scale(.9,1.2)}60%{transform:scale(1.12,.88)}}
.popout svg.rc{animation:po .25s ease-out}@keyframes po{from{transform:scale(1.15,.7)}}
#s2{touch-action:none}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
#fx span{position:absolute;top:-30px;width:28px;animation:fall 2s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
/* centered "استعد" prompt: hidden unless a round starts it */
#rdy{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:25}
#rdy.on{display:flex}
#rdy .rb{position:relative;width:min(64vmin,340px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;animation:rdyPop 1s ease-out}
#rdy svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:url(#cr)}
#rdy .f{fill:var(--chip);stroke:var(--ink);stroke-width:4;opacity:.94}
#rdy .s{fill:var(--ink);opacity:.85}
#rdy .rb.n span{font-size:clamp(90px,28vmin,210px)}
#rdy span{position:relative;font-weight:900;font-size:clamp(46px,13vmin,96px);line-height:1;color:var(--c1);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;filter:url(#cr2)}
#mg{position:fixed;inset:0;z-index:28;display:none;align-items:center;justify-content:center;background:#fffdf3;transition:opacity .4s}
#mg.on{display:flex}#mg.fade{opacity:0}
#mg .pg{position:relative;direction:ltr;width:min(96vw,calc((100dvh - 16px)*1.9));aspect-ratio:1.9/1}
#mg .pn{position:absolute;background:#1b1826;opacity:0}
#mg .pn.in{animation:slam .3s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes slam{0%{opacity:0;transform:scale(1.35) rotate(-2deg)}60%{opacity:1;transform:scale(.97) rotate(.6deg)}100%{opacity:1;transform:scale(1)}}
#mg .p1{left:1%;top:2%;width:47%;height:52%;clip-path:polygon(0 0,100% 0,94% 100%,0 100%)}
#mg .p2{left:50%;top:2%;width:49%;height:52%;clip-path:polygon(6% 0,100% 0,100% 100%,0 100%)}
#mg .p3{left:1%;top:57%;width:98%;height:41%;clip-path:polygon(0 0,100% 5%,100% 100%,0 100%)}
#mg .pb{position:absolute;inset:3px;clip-path:inherit;background:#fffdf3;overflow:hidden}
#mg .pb::before{content:"";position:absolute;inset:0;background:radial-gradient(#1b182633 1.3px,transparent 1.7px) 0 0/8px 8px}
#mg i{position:absolute}
#mg .rad{inset:-30%;background:repeating-conic-gradient(#1b1826 0 1.3deg,transparent 1.3deg 6.5deg);-webkit-mask:radial-gradient(circle,transparent 24%,#000 64%);mask:radial-gradient(circle,transparent 24%,#000 64%);animation:jit .16s steps(2) infinite}
@keyframes jit{to{transform:rotate(3deg)}}
#mg .hz{inset:0;background:repeating-linear-gradient(0deg,#1b1826 0 1.6px,transparent 1.6px 9px),repeating-linear-gradient(0deg,transparent 0 4px,#1b1826 4px 5px,transparent 5px 13px);-webkit-mask:linear-gradient(90deg,#000 0,#000 40%,transparent 88%);mask:linear-gradient(90deg,#000 0,#000 40%,transparent 88%);animation:hzs .18s linear infinite}
@keyframes hzs{to{background-position:-40px 0,-40px 0}}
#mg .cv{inset:-20%;background:repeating-conic-gradient(from 90deg at 50% 70%,#1b1826 0 1.2deg,transparent 1.2deg 8deg);-webkit-mask:radial-gradient(circle at 50% 70%,transparent 16%,#000 68%);mask:radial-gradient(circle at 50% 70%,transparent 16%,#000 68%);animation:jit .16s steps(2) infinite}
#mg .rcw{bottom:auto;transition:none;z-index:3}
#mg .hd{left:6%;top:3%;width:80%}
#mg .rn{bottom:6%;top:auto;width:36%;left:-42%;transform:rotate(-5deg)}
#mg .p2.in .rn{animation:rn 1.1s linear forwards}
@keyframes rn{from{left:-42%}to{left:112%}}
#mg .ot{bottom:6%;top:auto;width:14%;left:86%;transform-origin:50% 100%}
#mg .p3.in .ot{animation:ot 1.1s cubic-bezier(.5,0,.8,.6) .2s forwards}
@keyframes ot{from{left:86%;transform:scale(1)}85%{opacity:1}to{left:43%;transform:scale(.26);opacity:0}}
#mg .fx{position:absolute;font-weight:900;font-size:clamp(28px,8vmin,72px);color:#fffdf3;-webkit-text-stroke:5px #1b1826;paint-order:stroke fill;transform:skew(-10deg) rotate(-6deg);opacity:0;z-index:5;white-space:nowrap}
#mg .in .fx{animation:fxp .35s .12s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes fxp{from{opacity:0;transform:scale(.3) skew(-10deg) rotate(-6deg)}to{opacity:1;transform:scale(1) skew(-10deg) rotate(-6deg)}}
#mg .f2{right:8%;top:8%}#mg .f3{left:6%;top:12%}
#mg .bw{position:absolute;right:3%;top:6%;width:44%;z-index:4;opacity:0}
#mg .in .bw{animation:bp .3s .2s cubic-bezier(.2,1.6,.4,1) forwards}@keyframes bp{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
#mg .bw svg{width:100%;display:block}
#mg .bw span{position:absolute;inset:0 0 18% 0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(14px,3.6vmin,30px);color:#1b1826}
#mg .bigf{position:absolute;right:5%;bottom:5%;width:34%;z-index:4;transform:rotate(-10deg)}
#mg .bigf svg,#mg .door{width:100%;display:block;overflow:visible}
#mg .door{position:absolute;left:38%;bottom:0;width:24%;z-index:2}
@media (max-height:430px){.btn{height:50px;min-width:200px}.stack{gap:10px}.hud{height:60px}.top{min-height:36px}.stage{width:min(100%,calc((100dvh - 140px)*2),760px)}h1{margin-bottom:8px}.modal{gap:6px;padding:12px 28px}}

/* ---- mobile first ---- */
.bind{position:absolute}
@media (max-width:950px),(max-height:500px){.screen{padding:6px 44px 6px 8px}.bind{right:4px;width:22px}
 #app{background:linear-gradient(270deg,transparent 0 34px,var(--marg) 34px 36px,transparent 36px),repeating-linear-gradient(0deg,transparent 0 31px,var(--line) 31px 32px),var(--paper)}
 .hud{height:52px}.top{min-height:34px}.msg{font-size:clamp(17px,4.2vmin,26px)}
 .stage{width:min(100%,calc((100dvh - 100px)*2),900px)}}
@media (orientation:portrait) and (max-width:950px){
 #app{inset:auto;top:0;left:0;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
 .stage{width:min(100%,calc((100vw - 100px)*2),900px)}
 h1{font-size:clamp(40px,13vw,90px)}.btn{font-size:clamp(18px,5vw,26px);height:56px}.msg{font-size:clamp(17px,4.6vw,26px)}
 .card .rc{width:min(26vw,150px)}.card{width:min(30vh,230px)}.card b{font-size:clamp(20px,5vw,30px)}}
/* ---- extra rig animations ---- */
@keyframes idh{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}65%{transform:rotate(3deg) translateY(-1px)}}
.rc:not(.walk):not(.happy):not(.sad):not(.run) .head{animation:idh 3.6s ease-in-out infinite}
@keyframes idarm{50%{transform:rotate(-4deg)}}.rc:not(.walk):not(.happy):not(.sad):not(.run) .armL{animation:idarm 2.6s ease-in-out infinite}
.run .legL,.run .legR,.run .armL,.run .armR{animation:lg .15s ease-in-out infinite alternate;--sw:42deg}
.run .legR,.run .armL{animation-direction:alternate-reverse}
@keyframes rb{0%,100%{transform:translateY(0) rotate(-7deg) scale(1.03,.97)}50%{transform:translateY(-9px) rotate(-7deg) scale(.97,1.04)}}
.run .all{animation:rb .15s ease-in-out infinite}.run .tail{animation:tws .1s ease-in-out infinite alternate}.run .head{transform:rotate(-6deg)}
.sad .bod{animation:none;transform:scale(1.02,.94)}
@keyframes ldg{0%{transform:scale(1.25,.75)}50%{transform:scale(.92,1.08)}100%{transform:scale(1)}}.land .all{animation:ldg .35s ease-out}
.rcw{will-change:left,transform}
/* night */

/* street */
#rd{overflow:hidden;border-radius:18px;background:#8d8a99;box-shadow:0 0 0 4px var(--ink)}
#rd .side{position:absolute;top:0;bottom:0;width:12%;background:repeating-linear-gradient(0deg,#86d9ae 0 14px,#77cc9f 14px 28px);z-index:0}
#rd .side.l{left:0;border-right:4px solid var(--ink)}#rd .side.r{right:0;border-left:4px solid var(--ink)}

#rd .ln{position:absolute;top:-60px;bottom:0;width:0;border-left:4px dashed #fffdf3;opacity:.9;animation:lnm var(--ls,.4s) linear infinite}
@keyframes lnm{to{transform:translateY(60px)}}
#rd .car{position:absolute;top:0;z-index:3;transform:translate(-50%,-100%);filter:drop-shadow(1px 3px 2px rgba(0,0,0,.35))}
#rd .car svg{width:100%;display:block;overflow:visible}
#rd .rcw{bottom:2%;width:13%;transition:none;transform:translateX(-50%);z-index:4}
#rd .goal{position:absolute;top:2%;left:50%;width:9%;transform:translateX(-50%) scale(var(--gs,.4));transform-origin:50% 0;z-index:2;transition:transform .2s}
#rd .goal .ico{width:100%;display:block;filter:drop-shadow(0 0 6px #fff3a0)}
#rd .bar{position:absolute;left:14%;right:14%;top:1.5%;height:3%;border:3px solid var(--ink);border-radius:9px;background:#fffdf3;z-index:5;overflow:hidden}
#rd .bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--c2)}
#rd .bump{position:absolute;bottom:4%;width:26%;z-index:6;left:-30%}
.tz{position:absolute;top:0;bottom:0;width:50%;z-index:8}.tz.l{left:0}.tz.r{right:0}
.tz b{position:absolute;bottom:10px;width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);background:rgba(255,253,243,.75);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;opacity:.7}
.tz.l b{left:12px}.tz.r b{right:56px}.tz.on b{background:var(--c2);opacity:1}
/* kitchen */
#gs .kit{display:none;position:absolute;inset:0;pointer-events:none}
#gs.kitchen .kit{display:block}
#gs.kitchen .gi use:not(#tgt),#gs.kitchen .plk,#gs.kitchen .tag,#gs.kitchen .ht2,#gs.kitchen .camst,#gs.kitchen #cone,#gs.kitchen .pos,#gs.kitchen .br,#gs.kitchen use[href="#i-star"],#gs.kitchen #cam2{display:none}

.kit svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:url(#cr2)}
.chef{position:absolute;left:44%;bottom:6%;width:20%;z-index:2;transition:transform .25s}
.chef.face{transform:scaleX(-1)}
.chef svg{position:static!important;width:100%;height:auto!important}
.chef .ex{position:absolute;left:30%;top:-26%;font-size:clamp(28px,7vmin,60px);font-weight:900;color:#e2574c;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;display:none;animation:pop .3s}
.chef.warn .ex{display:block}
.chef .knife{transform-origin:20% 80%;animation:chop .22s ease-in-out infinite alternate}.chef.face .knife{animation:none}
@keyframes chop{to{transform:rotate(28deg)}}
.chef .spot{display:none}.chef.face .spot{display:block}

// ---------- Screen smash ----------
function crackPaths(){let d='';const cx=50,cy=48,n=14;for(let k=0;k<n;k++){const a=k/n*Math.PI*2+Math.random()*.3;let x=cx,y=cy,r=0;d+=`M${cx} ${cy}`;
 while(r<95){r+=6+Math.random()*12;const aa=a+(Math.random()-.5)*.35;x=cx+Math.cos(aa)*r;y=cy+Math.sin(aa)*r*.75;d+=` L${x.toFixed(1)} ${y.toFixed(1)}`}}
 for(const R of [5,11,19,30]){let first=1;for(let k=0;k<=n;k++){const a=k/n*Math.PI*2,j=R*(.85+Math.random()*.3);if(Math.random()<.25&&!first){first=1;continue}d+=(first?' M':' L')+(cx+Math.cos(a)*j).toFixed(1)+' '+(cy+Math.sin(a)*j*.75).toFixed(1);first=0}}return d}
async function smash(w){const o=document.createElement('div');o.className='smash';
 o.innerHTML=`<div class="glass"></div><div class="fly">${raccoon(S.char)}</div><svg class="crk" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${crackPaths()}" stroke-width=".45"/><path d="${crackPaths()}" stroke-width=".2"/></svg>`;
 document.body.appendChild(o);const f=o.querySelector('.fly'),sv=f.querySelector('svg');setRC(sv,'sad');sfxH.whoosh();
 try{await w(550);f.classList.add('hit');o.querySelector('.crk').classList.add('on');o.querySelector('.glass').classList.add('on');
  sfxH.crash();A.n(.35,5000,.4,2500);[2200,3100,2700,3600].forEach((q,i)=>A.t(q,.12,'triangle',.04+i*.05,.05));
  document.body.classList.remove('quake');void document.body.offsetWidth;document.body.classList.add('quake');await w(1800)}
 finally{o.remove();document.body.classList.remove('quake')}}
