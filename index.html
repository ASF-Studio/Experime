<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المكتب الذكي — صانع التطبيقات ومواقع HTML</title>
  <style>
    :root {
      --primary: #065f46;
      --primary-hover: #047857;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
    .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; }
    header h1 { font-size: 1.7rem; color: var(--primary); font-weight: 800; }
    header p { color: var(--muted); font-size: 0.95rem; }

    .ceo-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .ceo-box label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; }
    .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .input-row input { flex: 1; min-width: 240px; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 11px 22px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.95rem; transition: 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-outline { background: #fff; color: var(--text); border: 1px solid #cbd5e1; }
    .btn-outline:hover { background: #f1f5f9; }

    .meeting-banner { display: none; background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; }

    .office-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .desk { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; transition: 0.3s; }
    .desk.active { border-color: var(--primary); box-shadow: 0 4px 12px rgba(6, 95, 70, 0.08); }
    .desk-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .dept { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
    .badge { font-size: 0.75rem; padding: 3px 10px; border-radius: 99px; font-weight: 600; background: #f1f5f9; color: #475569; }
    .badge.working { background: #d1fae5; color: #065f46; }
    .badge.meeting { background: #fef3c7; color: #92400e; }
    .desk h3 { font-size: 1.05rem; margin-bottom: 2px; }
    .role { font-size: 0.82rem; color: var(--muted); margin-bottom: 10px; }
    .task-box { background: #f8fafc; border-radius: 8px; padding: 10px; font-size: 0.85rem; color: #334155; border: 1px solid #f1f5f9; }

    .delivery { display: none; background: var(--card); border: 2px solid #10b981; border-radius: 16px; padding: 20px; flex-direction: column; gap: 20px; }
    .delivery-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
    .delivery-header h2 { color: var(--primary); font-size: 1.2rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .split-view { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .panel h4 { margin-bottom: 8px; font-size: 0.92rem; }
    iframe { width: 100%; height: 450px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
    textarea.code-box { width: 100%; height: 450px; background: #0f172a; color: #6ee7b7; border: none; border-radius: 10px; padding: 14px; font-family: monospace; font-size: 0.82rem; direction: ltr; resize: vertical; }

    .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; border-top: 1px solid var(--border); padding-top: 16px; }
    .report-card { padding: 14px; border-radius: 10px; font-size: 0.88rem; }
    .report-done { background: #ecfdf5; color: #064e3b; }
    .report-todo { background: #f1f5f9; color: #1e293b; }
    .report-card h4 { margin-bottom: 8px; }
    .report-card ul { padding-right: 18px; display: flex; flex-direction: column; gap: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>المكتب الذكي</h1>
      <p>أنت المدير التنفيذي. اكتب فكرتك، والفريق يبني لك تطبيق أو موقع HTML حقيقي جاهز.</p>
    </header>

    <div class="ceo-box">
      <label for="ideaInput">اكتب فكرة التطبيق أو الموقع:</label>
      <div class="input-row">
        <input id="ideaInput" type="text" placeholder="اكتب فكرتك هنا..." />
        <button id="startBtn" class="btn" type="button">ابدأ التنفيذ</button>
      </div>
    </div>

    <div id="meetingBanner" class="meeting-banner"></div>

    <div class="office-grid" id="officeGrid"></div>

    <div id="deliveryBox" class="delivery">
      <div class="delivery-header">
        <h2 id="deliveryTitle">تم بناء المشروع وتسليمه بلغة HTML</h2>
        <div class="actions">
          <button id="openTabBtn" class="btn btn-outline" type="button">تشغيل في نافذة مستقلة</button>
          <button id="copyBtn" class="btn btn-outline" type="button">نسخ كود HTML</button>
          <button id="downloadBtn" class="btn" type="button">تحميل index.html</button>
        </div>
      </div>

      <div class="split-view">
        <div class="panel">
          <h4>معاينة التطبيق الحي:</h4>
          <iframe id="previewFrame" sandbox="allow-scripts allow-forms allow-modals"></iframe>
        </div>
        <div class="panel">
          <h4>كود HTML الكامل:</h4>
          <textarea id="codeOutput" class="code-box" readonly></textarea>
        </div>
      </div>

      <div class="report-grid">
        <div class="report-card report-done">
          <h4>ما تم إنجازه بالتفصيل:</h4>
          <ul id="doneList"></ul>
        </div>
        <div class="report-card report-todo">
          <h4>ما تبقى لإكمال المشروع وتطويره:</h4>
          <ul id="todoList"></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    const team = [
      { id: "res", name: "سارة", role: "باحثة ومتطلبات المشروع", dept: "التحليل والبحث", status: "idle", task: "جالسة على مكتبها بانتظار فكرة المشروع" },
      { id: "des", name: "خالد", role: "مصمم واجهات تفاعلية", dept: "التصميم", status: "idle", task: "جاهز لتصميم الواجهة والأزرار" },
      { id: "dev", name: "عمر", role: "مطور تطبيقات HTML/JS", dept: "البرمجة", status: "idle", task: "جاهز لكتابة الكود الفعلي" },
      { id: "qa",  name: "نورة", role: "مختبرة جودة QA", dept: "الجودة والفحص", status: "idle", task: "جاهزة لاختبار العمل قبل التسليم" }
    ];

    let generatedHtml = "";
    let currentBlobUrl = null;
    const CLOSE_SCRIPT = "<" + "/script>";

    function renderOffice() {
      const grid = document.getElementById("officeGrid");
      grid.innerHTML = team.map(function(emp) {
        const badgeText = emp.status === "working" ? "يعمل بتركيز" : emp.status === "meeting" ? "في اجتماع مختصر" : "على مكتبه";
        const activeClass = emp.status !== "idle" ? "active" : "";
        return '<div class="desk ' + activeClass + '">' +
          '<div class="desk-top">' +
            '<span class="dept">' + emp.dept + '</span>' +
            '<span class="badge ' + emp.status + '">' + badgeText + '</span>' +
          '</div>' +
          '<h3>' + emp.name + '</h3>' +
          '<div class="role">' + emp.role + '</div>' +
          '<div class="task-box">' + emp.task + '</div>' +
        '</div>';
      }).join("");
    }

    function buildRealApp(idea) {
      const title = idea.trim();

      if (/لعبة|جيم|نقاط|مغامرة|سباق|تفادي|جمع/.test(title)) {
        return {
          appType: "لعبة ويب تفاعلية (HTML5 Canvas)",
          done: [
            "بناء محرك لعبة حقيقي على Canvas مع تحكم بالأزرار واللوحة.",
            "نظام حساب النقاط، تسجيل أعلى نتيجة، وإعادة اللعب الفورية.",
            "ملف HTML واحد مستقل يعمل مباشرة في أي متصفح."
          ],
          todo: [
            "إضافة مؤثرات صوتية وموسيقى خلفية.",
            "إضافة مراحل متعددة ومستويات صعوبة متدرجة.",
            "ربط لوحة صدارة لحفظ نتائج اللاعبين."
          ],
          html: '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="UTF-8" />\n<meta name="viewport" content="width=device-width, initial-scale=1.0" />\n<title>' + title + '</title>\n<style>\n* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }\nbody { background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; gap: 12px; }\n.hud { display: flex; gap: 20px; background: #1e293b; padding: 10px 20px; border-radius: 12px; font-weight: 700; }\ncanvas { background: #020617; border: 2px solid #10b981; border-radius: 14px; max-width: 100%; }\n.controls { display: flex; gap: 10px; }\nbutton { background: #10b981; color: #022c22; border: none; padding: 9px 18px; border-radius: 8px; font-weight: 800; cursor: pointer; }\n</style>\n</head>\n<body>\n<h2>' + title + '</h2>\n<div class="hud"><div>النقاط: <span id="score">0</span></div><div>الأعلى: <span id="best">0</span></div></div>\n<canvas id="game" width="440" height="300"></canvas>\n<div class="controls"><button onclick="moveLeft()">يسار ◀</button><button onclick="restartGame()">إعادة تشغيل</button><button onclick="moveRight()">يمين ▶</button></div>\n<script>\nconst canvas = document.getElementById("game");\nconst ctx = canvas.getContext("2d");\nlet playerX = 200, score = 0, best = 0, gameOver = false, items = [];\nfunction moveLeft() { playerX = Math.max(0, playerX - 35); }\nfunction moveRight() { playerX = Math.min(canvas.width - 44, playerX + 35); }\nwindow.addEventListener("keydown", function(e) {\n  if (e.key === "ArrowLeft" || e.key === "a") moveLeft();\n  if (e.key === "ArrowRight" || e.key === "d") moveRight();\n});\nfunction spawnItem() {\n  if (gameOver) return;\n  items.push({ x: Math.random() * (canvas.width - 24), y: -20, speed: 2.3 + Math.min(4, score * 0.1), isGood: Math.random() > 0.3 });\n}\nfunction restartGame() { score = 0; items = []; gameOver = false; playerX = 200; document.getElementById("score").textContent = "0"; }\nfunction loop() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n  ctx.fillStyle = "#34d399";\n  ctx.fillRect(playerX, canvas.height - 28, 44, 16);\n  for (let i = items.length - 1; i >= 0; i--) {\n    const it = items[i];\n    if (!gameOver) it.y += it.speed;\n    ctx.fillStyle = it.isGood ? "#fbbf24" : "#f43f5e";\n    ctx.beginPath(); ctx.arc(it.x + 10, it.y + 10, 10, 0, Math.PI * 2); ctx.fill();\n    const hit = it.y + 20 >= canvas.height - 28 && it.y <= canvas.height - 12 && it.x + 20 >= playerX && it.x <= playerX + 44;\n    if (hit) {\n      if (it.isGood) { score += 10; document.getElementById("score").textContent = score; if (score > best) { best = score; document.getElementById("best").textContent = best; } }\n      else { gameOver = true; }\n      items.splice(i, 1); continue;\n    }\n    if (it.y > canvas.height) items.splice(i, 1);\n  }\n  if (gameOver) {\n    ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, 0, canvas.width, canvas.height);\n    ctx.fillStyle = "#fff"; ctx.font = "bold 20px system-ui"; ctx.textAlign = "center";\n    ctx.fillText("انتهت الجولة! اضغط إعادة تشغيل", canvas.width / 2, canvas.height / 2);\n  }\n  requestAnimationFrame(loop);\n}\nsetInterval(spawnItem, 850);\nloop();\n' + CLOSE_SCRIPT + '\n</body>\n</html>'
        };
      }

      if (/مهام|نقاط|تودو|قائمة|عائلة|إنتاجية|جدول/.test(title)) {
        return {
          appType: "تطبيق مهام ونقاط تفاعلي",
          done: [
            "إضافة مهام جديدة مع تحديد عدد النقاط لكل مهمة.",
            "تعليم المهام كمنجزة وحساب إجمالي النقاط تلقائياً.",
            "إمكانية حذف المهام وتحديث القائمة مباشرة."
          ],
          todo: [
            "ربط التطبيق بقاعدة بيانات سحابية لمزامنة النقاط.",
            "إضافة حسابات متعددة ومتجر مكافآت."
          ],
          html: '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="UTF-8" />\n<meta name="viewport" content="width=device-width, initial-scale=1.0" />\n<title>' + title + '</title>\n<style>\n* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }\nbody { background: #f1f5f9; color: #0f172a; padding: 20px; }\n.app { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; }\n.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }\n.points { background: #d1fae5; color: #065f46; padding: 6px 14px; border-radius: 99px; font-weight: 800; }\n.row { display: flex; gap: 8px; margin-bottom: 16px; }\ninput { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; }\ninput[type="text"] { flex: 1; }\ninput[type="number"] { width: 95px; }\nbutton { background: #065f46; color: #fff; border: none; padding: 9px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }\nul { list-style: none; display: flex; flex-direction: column; gap: 8px; }\nli { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px 12px; border-radius: 10px; border: 1px solid #e2e8f0; }\n.done { text-decoration: line-through; color: #94a3b8; }\n.small-btn { background: #e2e8f0; color: #0f172a; padding: 5px 10px; font-size: 0.8rem; }\n</style>\n</head>\n<body>\n<div class="app">\n<div class="top"><h2>' + title + '</h2><div class="points">النقاط: <span id="totalPts">0</span></div></div>\n<div class="row"><input id="taskName" type="text" placeholder="اكتب مهمة جديدة..." /><input id="taskPts" type="number" value="10" min="1" /><button onclick="addTask()">إضافة</button></div>\n<ul id="list"></ul>\n</div>\n<script>\nlet tasks = [{ title: "إنجاز أول مهمة", pts: 15, done: false }];\nfunction render() {\n  const list = document.getElementById("list");\n  let total = 0;\n  list.innerHTML = tasks.map(function(t, i) {\n    if (t.done) total += Number(t.pts || 0);\n    return \'<li><span class="\' + (t.done ? "done" : "") + \'" onclick="toggleTask(\' + i + \')" style="cursor:pointer">\' + t.title + \' (+\' + t.pts + \' نقطة)</span><div style="display:flex;gap:6px"><button class="small-btn" onclick="toggleTask(\' + i + \')">\' + (t.done ? "إلغاء" : "إنجاز") + \'</button><button class="small-btn" onclick="deleteTask(\' + i + \')">حذف</button></div></li>\';\n  }).join("");\n  document.getElementById("totalPts").textContent = total;\n}\nfunction addTask() {\n  const inp = document.getElementById("taskName");\n  const pts = Number(document.getElementById("taskPts").value || 10);\n  if (!inp.value.trim()) return;\n  tasks.push({ title: inp.value.trim(), pts: pts, done: false });\n  inp.value = ""; render();\n}\nfunction toggleTask(i) { tasks[i].done = !tasks[i].done; render(); }\nfunction deleteTask(i) { tasks.splice(i, 1); render(); }\nrender();\n' + CLOSE_SCRIPT + '\n</body>\n</html>'
        };
      }

      return {
        appType: "تطبيق ويب تفاعلي متكامل",
        done: [
          "بناء تطبيق متكامل بلغة HTML + CSS + JavaScript مخصص لفكرة «" + title + "».",
          "إضافة نظام إدارة عناصر وسلة تفاعل وحساب تلقائي للإجمالي.",
          "واجهة عربية نظيفة تعمل على الجوال والكمبيوتر."
        ],
        todo: [
          "ربط التطبيق بقاعدة بيانات حقيقية لحفظ المدخلات.",
          "إضافة تسجيل دخول ولوحة تحكم للمشرف.",
          "نشر الملف على استضافة مثل GitHub Pages."
        ],
        html: '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="UTF-8" />\n<meta name="viewport" content="width=device-width, initial-scale=1.0" />\n<title>' + title + '</title>\n<style>\n* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }\nbody { background: #f8fafc; padding: 20px; color: #0f172a; }\n.wrap { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }\n@media (max-width: 680px) { .wrap { grid-template-columns: 1fr; } }\n.products { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }\n.card, .cart { background: #fff; padding: 14px; border-radius: 12px; border: 1px solid #e2e8f0; }\nbutton { background: #065f46; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 8px; }\n</style>\n</head>\n<body>\n<h2 style="max-width:820px;margin:0 auto 14px">' + title + '</h2>\n<div class="wrap">\n<div class="products" id="prods"></div>\n<div class="cart">\n<h3>القائمة المختارة</h3>\n<ul id="cartList" style="list-style:none;margin:10px 0;font-size:0.9rem"></ul>\n<div>الإجمالي: <strong id="total">0</strong> ر.س</div>\n<button onclick="checkout()">تأكيد العملية</button>\n<p id="msg" style="margin-top:8px;color:#065f46;font-weight:700;font-size:0.85rem"></p>\n</div>\n</div>\n<script>\nconst catalog = [\n  { name: "الخيار الأساسي", price: 50 },\n  { name: "الخيار المتقدم", price: 100 },\n  { name: "الخيار الشامل", price: 180 }\n];\nlet cart = [];\ndocument.getElementById("prods").innerHTML = catalog.map(function(p, idx) {\n  return \'<div class="card"><h4>\' + p.name + \'</h4><p style="color:#065f46;font-weight:800">\' + p.price + \' ر.س</p><button onclick="addToCart(\' + idx + \')">إضافة</button></div>\';\n}).join("");\nfunction addToCart(idx) { cart.push(catalog[idx]); renderCart(); }\nfunction renderCart() {\n  document.getElementById("cartList").innerHTML = cart.map(function(c) { return "<li>• " + c.name + " — " + c.price + " ر.س</li>"; }).join("");\n  document.getElementById("total").textContent = cart.reduce(function(s, c) { return s + c.price; }, 0);\n}\nfunction checkout() {\n  if (!cart.length) return;\n  document.getElementById("msg").textContent = "تم تنفيذ العملية بنجاح!";\n  cart = []; renderCart();\n}\n' + CLOSE_SCRIPT + '\n</body>\n</html>'
      };
    }

    function startProject() {
      const idea = document.getElementById("ideaInput").value.trim();
      if (!idea) return;

      const btn = document.getElementById("startBtn");
      const meetingBanner = document.getElementById("meetingBanner");
      const deliveryBox = document.getElementById("deliveryBox");

      btn.disabled = true;
      btn.textContent = "الفريق يعمل...";
      deliveryBox.style.display = "none";
      meetingBanner.style.display = "none";

      team[0].status = "working"; team[0].task = 'تحليل متطلبات "' + idea + '"';
      team[1].status = "working"; team[1].task = "تصميم واجهة التطبيق والأزرار";
      team[2].status = "idle";    team[2].task = "على مكتبه بانتظار المخطط";
      team[3].status = "idle";    team[3].task = "على مكتبها بانتظار النسخة الأولية";
      renderOffice();

      const needsMeeting = idea.split(" ").length >= 4;
      setTimeout(function() {
        if (needsMeeting) {
          meetingBanner.style.display = "block";
          meetingBanner.innerHTML = "<strong>تنسيق سريع (سارة + خالد + عمر):</strong> تحديد منطق التطبيق ومزاياه لـ «" + idea + "».";
          team[0].status = "meeting"; team[0].task = "توضيح متطلبات الفكرة";
          team[1].status = "meeting"; team[1].task = "تأكيد شكل الواجهة";
          team[2].status = "meeting"; team[2].task = "استلام منطق البرمجة";
          team[3].status = "idle";    team[3].task = "في مكتبها لعدم حاجة الاجتماع لها";
          renderOffice();
        }
      }, 1000);

      setTimeout(function() {
        meetingBanner.style.display = "none";
        team[0].status = "idle";    team[0].task = "أنهت التحليل";
        team[1].status = "idle";    team[1].task = "أنهى التصميم";
        team[2].status = "working"; team[2].task = "برمجة التطبيق بالكامل داخل HTML + JS";
        team[3].status = "working"; team[3].task = "اختبار عمل التطبيق والنتائج";
        renderOffice();
      }, 2200);

      setTimeout(function() {
        team.forEach(function(emp) { emp.status = "idle"; emp.task = "التطبيق جاهز وتم تسليمه"; });
        renderOffice();

        const built = buildRealApp(idea);
        generatedHtml = built.html;

        if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
        const blob = new Blob([generatedHtml], { type: "text/html;charset=utf-8" });
        currentBlobUrl = URL.createObjectURL(blob);

        document.getElementById("deliveryTitle").textContent = "تم بناء: " + built.appType;
        const frame = document.getElementById("previewFrame");
        frame.src = currentBlobUrl;
        document.getElementById("codeOutput").value = generatedHtml;

        document.getElementById("doneList").innerHTML = built.done.map(function(x) { return "<li>" + x + "</li>"; }).join("");
        document.getElementById("todoList").innerHTML = built.todo.map(function(x) { return "<li>" + x + "</li>"; }).join("");

        deliveryBox.style.display = "flex";
        btn.disabled = false;
        btn.textContent = "ابدأ التنفيذ";
      }, 3400);
    }

    document.getElementById("startBtn").addEventListener("click", startProject);
    document.getElementById("ideaInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") startProject();
    });

    document.getElementById("openTabBtn").addEventListener("click", function() {
      if (currentBlobUrl) window.open(currentBlobUrl, "_blank");
    });

    document.getElementById("copyBtn").addEventListener("click", function() {
      const textarea = document.getElementById("codeOutput");
      textarea.select();
      document.execCommand("copy");
      if (navigator.clipboard) navigator.clipboard.writeText(generatedHtml);
      const copyBtn = document.getElementById("copyBtn");
      copyBtn.textContent = "تم النسخ ✓";
      setTimeout(function() { copyBtn.textContent = "نسخ كود HTML"; }, 2000);
    });

    document.getElementById("downloadBtn").addEventListener("click", function() {
      if (!currentBlobUrl) return;
      const a = document.createElement("a");
      a.href = currentBlobUrl;
      a.download = "index.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    renderOffice();
  </script>
</body>
</html>
